name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read

    env:
      QT_QPA_PLATFORM: offscreen
      S_USDV_DATA_ROOT: /tmp/s-usdv-ci
      S_USDV_DATABASE_URL: sqlite:////tmp/s-usdv-ci/s_usdv.db
      S_USDV_STORAGE_ROOT: /tmp/s-usdv-ci/storage
      S_USDV_TEMPORARY_ROOT: /tmp/s-usdv-ci/temp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-desktop.txt
            requirements-ci.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Create isolated application directories
        run: |
          mkdir -p "$S_USDV_DATA_ROOT"
          mkdir -p "$S_USDV_STORAGE_ROOT"
          mkdir -p "$S_USDV_TEMPORARY_ROOT"

      - name: Verify environment
        run: python scripts/ci/check_environment.py

      - name: Compile Python source
        run: |
          python -m compileall -q \
            s_usd_core \
            s_usd_service \
            s_usd_desktop

      - name: Run complete test suite
        run: |
          python scripts/ci/run_tests.py \
            tests \
            -vv \
            --tb=long \
            -ra

  quality-security:
    name: Source quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality and security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt

      - name: Verify tool dependency consistency
        run: python -m pip check

      - name: Lint production source
        run: |
          python -m ruff check \
            s_usd_core \
            s_usd_service \
            s_usd_desktop \
            --output-format github

      - name: Verify production source formatting
        run: |
          python -m ruff format \
            --check \
            s_usd_core \
            s_usd_service \
            s_usd_desktop

      - name: Scan production source with Bandit
        run: |
          python -m bandit \
            -c pyproject.toml \
            -r \
            s_usd_core \
            s_usd_service \
            s_usd_desktop \
            -ll \
            -ii

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-desktop.txt
            requirements-ci.txt
            requirements-quality.txt

      - name: Install audited dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-ci.txt \
            -r requirements-quality.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit installed Python dependencies
        run: |
          python -m pip_audit \
            --progress-spinner off \
            --desc on \
            --aliases on