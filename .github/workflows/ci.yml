name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      QT_QPA_PLATFORM: offscreen
      S_USDV_DATA_ROOT: /tmp/s-usdv-ci
      S_USDV_DATABASE_URL: sqlite:////tmp/s-usdv-ci/s_usdv.db
      S_USDV_STORAGE_ROOT: /tmp/s-usdv-ci/storage
      S_USDV_TEMPORARY_ROOT: /tmp/s-usdv-ci/temp

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-service.txt
            requirements-desktop.txt
            requirements-ci.txt

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Verify environment
        run: python scripts/ci/check_environment.py

      - name: Compile Python source
        run: python -m compileall -q s_usd_core s_usd_service s_usd_desktop

      - name: Run complete test suite
        run: python scripts/ci/run_tests.py tests -v
