[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv-ci",
    ".s_usd_data",
    ".s_usdv_data",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"s_usd_desktop/ui/storage/models.py" = ["B008"]
"s_usd_desktop/ui/widgets/comparison_browser/diff_view.py" = ["B008"]
"s_usd_desktop/ui/widgets/usd_viewport/outliner_model.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false

[tool.bandit]
exclude_dirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".venv-ci",
    ".s_usd_data",
    ".s_usdv_data",
    "build",
    "dist",
    "migrations",
    "scripts",
    "tests",
]